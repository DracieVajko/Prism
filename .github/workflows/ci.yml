name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  pc:
    name: PC tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        # Torch/transformers/onnxruntime are imported lazily by the server, so
        # the unit/contract suite runs without the 2 GB ML stack.
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn httpx pydantic numpy pillow pytest \
                      python-multipart starlette pyyaml requests
      - name: pytest
        working-directory: pc
        run: python -m pytest -q

      - name: API fuzz testing with Schemathesis
        # Start the PC server (needs torch for diffusion_server import) and
        # fuzz the OpenAPI contract to catch unhandled errors and ensure
        # honest 503 responses for unsupported features.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install schemathesis
          cd pc
          python -m uvicorn unified_server:app --host 127.0.0.1 --port 8101 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8101/health > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          schemathesis run http://127.0.0.1:8101/openapi.json --checks all \
            --max-time 300 --exit-code-on-first-failure || true
          kill $SERVER_PID 2>/dev/null || true

  android:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # The Android SDK is preinstalled on the runner, but cmdline-tools is no
      # longer on PATH (android-actions/setup-android@v3 also fails here trying
      # to install the removed 'tools' package). Resolve sdkmanager from the
      # SDK root and install the packages this project builds against.
      - name: Install SDK packages
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -name sdkmanager -type f | head -1)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      # whisper.cpp, llama.cpp, LAME and ncnn are not committed (.gitignore):
      # locally they are staged by android/tools/fetch_third_party.ps1 and
      # fetch_ncnn.ps1. CI fetches the same sources; whisper.cpp is pinned to
      # v1.9.5 and llama.cpp to the commit used locally, so the build matches.
      - name: Fetch native sources
        run: |
          set -euo pipefail
          WHISPER=android/app/src/main/cpp/third_party/whisper.cpp
          git clone --depth 1 --branch v1.9.5 https://github.com/ggerganov/whisper.cpp "$WHISPER"

          mkdir -p android/third_party
          git init -q android/third_party/llama.cpp
          git -C android/third_party/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp
          git -C android/third_party/llama.cpp fetch -q --depth 1 origin fae9ac561f7c20b320d89103be67372381485653
          git -C android/third_party/llama.cpp checkout -q FETCH_HEAD

          curl -fsSL --retry 3 -o "$RUNNER_TEMP/lame.tar.gz" \
            https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz
          tar -xzf "$RUNNER_TEMP/lame.tar.gz" -C android/third_party
          mv android/third_party/lame-3.100 android/third_party/lame

          NCNN_VER=20261020
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ncnn.zip" \
            "https://github.com/Tencent/ncnn/releases/download/$NCNN_VER/ncnn-$NCNN_VER-android-vulkan-shared.zip"
          unzip -q "$RUNNER_TEMP/ncnn.zip" -d android/app/src/main/cpp/third_party/ncnn-shared
          mkdir -p android/app/src/main/cpp/third_party/ncnn-jni/arm64-v8a
          cp "android/app/src/main/cpp/third_party/ncnn-shared/ncnn-$NCNN_VER-android-vulkan-shared/arm64-v8a/lib/libncnn.so" \
             android/app/src/main/cpp/third_party/ncnn-jni/arm64-v8a/
      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --console=plain --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: prism-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
